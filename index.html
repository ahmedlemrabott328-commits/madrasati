  /* ==================== جدول الحصص الأسبوعي ==================== */
  var scheduleTab = "byClass";
  var scheduleClassSel = null;
  var scheduleTeacherSel = null;

  function teachingStaff() {
    return STATE.teachers.filter(function (t) {
      return isTeachingCategory(t.category || "معلم / أستاذ") && t.status === "نشط";
    });
  }
  function periodById(periodId) {
    return (STATE.schedule.periods || []).find(function (p) { return p.id === periodId; });
  }
  function periodLabel(periodId) {
    var p = periodById(periodId);
    return p ? p.label : periodId;
  }
  function scheduleSlot(classId, day, periodId) {
    var forClass = STATE.schedule.slots[classId];
    var forDay = forClass && forClass[day];
    return (forDay && forDay[periodId]) || null;
  }
  function setScheduleSlot(classId, day, periodId, value) {
    STATE.schedule.slots[classId] = STATE.schedule.slots[classId] || {};
    STATE.schedule.slots[classId][day] = STATE.schedule.slots[classId][day] || {};
    if (value) STATE.schedule.slots[classId][day][periodId] = value;
    else delete STATE.schedule.slots[classId][day][periodId];
  }
  function teacherConflictAt(day, periodId, teacherId, excludeClassId) {
    if (!teacherId) return null;
    var found = null;
    Object.keys(STATE.schedule.slots).some(function (classId) {
      if (classId === excludeClassId) return false;
      var slot = scheduleSlot(classId, day, periodId);
      if (slot && slot.teacherId === teacherId) {
        found = classById(classId);
        return true;
      }
      return false;
    });
    return found;
  }
  function removePeriodEverywhere(periodId) {
    Object.keys(STATE.schedule.slots).forEach(function (classId) {
      SCHEDULE_DAYS.forEach(function (day) {
        var forDay = STATE.schedule.slots[classId] && STATE.schedule.slots[classId][day];
        if (forDay) delete forDay[periodId];
      });
    });
  }

  function renderSchedule() {
    var isAdmin = currentUser && currentUser.role === "admin";
    setPageHeader(tr("schedule_title"), tr("schedule_sub"),
      isAdmin ? '<button class="btn btn-ghost" id="btn-manage-periods">' + ICONS.schedule + " " + esc(tr("schedule_managePeriods")) + "</button>" : "");
    var actionsBtn = document.getElementById("btn-manage-periods");
    if (actionsBtn) actionsBtn.addEventListener("click", openPeriodsManager);

    var root = document.getElementById("view-root");
    root.innerHTML =
      '<div class="subtabs">' +
      '<button class="subtab-btn' + (scheduleTab === "byClass" ? " active" : "") + '" data-schedule-tab="byClass">' + esc(tr("scheduleTab_byClass")) + '</button>' +
      '<button class="subtab-btn' + (scheduleTab === "byTeacher" ? " active" : "") + '" data-schedule-tab="byTeacher">' + esc(tr("scheduleTab_byTeacher")) + '</button>' +
      '</div><div id="schedule-body"></div>';
    Array.prototype.forEach.call(root.querySelectorAll("[data-schedule-tab]"), function (b) {
      b.addEventListener("click", function () { scheduleTab = b.getAttribute("data-schedule-tab"); renderSchedule(); });
    });
    var body = document.getElementById("schedule-body");
    if (scheduleTab === "byClass") renderScheduleByClass(body);
    else renderScheduleByTeacher(body);
  }

  function scheduleGridHtml(periods, cellFn) {
    return (
      '<div class="table-scroll"><table><thead><tr><th>' + esc(tr("schedule_th_period")) + "</th>" +
      SCHEDULE_DAYS.map(function (d) { return "<th>" + esc(dayLabel(d)) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      periods.map(function (p) {
        return "<tr><td class=\"cell-name\">" + esc(p.label) + '<div style="font-size:11px;color:var(--ink-soft);" dir="ltr">' + esc(p.start) + "–" + esc(p.end) + "</div></td>" +
          SCHEDULE_DAYS.map(function (d) { return "<td>" + cellFn(d, p.id) + "</td>"; }).join("") +
          "</tr>";
      }).join("") +
      "</tbody></table></div>"
    );
  }

  function renderScheduleByClass(body) {
    var isAdmin = currentUser && currentUser.role === "admin";
    var classes = visibleClasses();
    if (!classes.length) {
      body.innerHTML = '<div class="panel"><div class="panel-body"><p class="empty-note">' + esc(tr("schedule_noClasses")) + "</p></div></div>";
      return;
    }
    if (!scheduleClassSel || !classes.some(function (c) { return c.id === scheduleClassSel; })) {
      scheduleClassSel = classes[0].id;
    }
    var classObj = classById(scheduleClassSel);
    var periods = STATE.schedule.periods;
    var toolbarHtml =
      '<div class="toolbar">' +
      '<select class="input" id="sch-class">' + classes.map(function (c) { return '<option value="' + c.id + '"' + (c.id === scheduleClassSel ? " selected" : "") + ">" + esc(c.name) + "</option>"; }).join("") + "</select>" +
      '<button class="btn btn-ghost" id="sch-export">' + ICONS.excel + " " + esc(tr("btn_exportExcel")) + "</button>" +
      (isAdmin ? "" : '<span class="empty-note" style="margin:0;">' + esc(tr("schedule_readOnlyNote")) + "</span>") +
      "</div>";
    var gridHtml = scheduleGridHtml(periods, function (day, periodId) {
      var slot = scheduleSlot(scheduleClassSel, day, periodId);
      var teacher = slot && slot.teacherId ? teacherById(slot.teacherId) : null;
      var inner = slot && (slot.subject || teacher)
        ? esc(slot.subject || tr("schedule_noSubject")) + (teacher ? '<div style="font-size:12px;color:var(--ink-soft);">' + esc(teacher.name) + "</div>" : "")
        : '<span class="empty-note" style="margin:0;">' + esc(tr("schedule_emptySlot")) + "</span>";
      return isAdmin
        ? '<button class="btn btn-ghost" style="width:100%;text-align:start;white-space:normal;" data-sch-cell="' + day + "|" + periodId + '">' + inner + "</button>"
        : '<div style="padding:6px 4px;">' + inner + "</div>";
    });
    body.innerHTML = '<div class="panel"><div class="panel-body">' + toolbarHtml + gridHtml + "</div></div>";
    document.getElementById("sch-class").addEventListener("change", function (e) { scheduleClassSel = e.target.value; renderScheduleByClass(body); });
    document.getElementById("sch-export").addEventListener("click", function () {
      var out = [[tr("schedule_th_period")].concat(SCHEDULE_DAYS.map(dayLabel))];
      periods.forEach(function (p) {
        var row = [p.label + " (" + p.start + "-" + p.end + ")"];
        SCHEDULE_DAYS.forEach(function (d) {
          var slot = scheduleSlot(scheduleClassSel, d, p.id);
          var teacher = slot && slot.teacherId ? teacherById(slot.teacherId) : null;
          row.push(slot ? (slot.subject || "") + (teacher ? " - " + teacher.name : "") : "");
        });
        out.push(row);
      });
      exportRowsAsExcel(tr("sheet_schedule") + " - " + (classObj ? classObj.name : "") + ".csv", tr("sheet_schedule"), out);
    });
    if (isAdmin) {
      Array.prototype.forEach.call(body.querySelectorAll("[data-sch-cell]"), function (btn) {
        btn.addEventListener("click", function () {
          var parts = btn.getAttribute("data-sch-cell").split("|");
          openScheduleSlotModal(scheduleClassSel, parts[0], parts[1]);
        });
      });
    }
  }

  function renderScheduleByTeacher(body) {
    var staff = teachingStaff();
    if (!staff.length) {
      body.innerHTML = '<div class="panel"><div class="panel-body"><p class="empty-note">' + esc(tr("schedule_noTeachingStaff")) + "</p></div></div>";
      return;
    }
    if (!scheduleTeacherSel || !staff.some(function (t) { return t.id === scheduleTeacherSel; })) {
      if (currentUser && currentUser.role === "teacher" && staff.some(function (t) { return t.id === currentUser.teacherId; })) {
        scheduleTeacherSel = currentUser.teacherId;
      } else {
        scheduleTeacherSel = staff[0].id;
      }
    }
    var periods = STATE.schedule.periods;
    var toolbarHtml =
      '<div class="toolbar">' +
      '<select class="input" id="sch-teacher">' + staff.map(function (t) { return '<option value="' + t.id + '"' + (t.id === scheduleTeacherSel ? " selected" : "") + ">" + esc(t.name) + "</option>"; }).join("") + "</select>" +
      '<button class="btn btn-ghost" id="sch-teacher-export">' + ICONS.excel + " " + esc(tr("btn_exportExcel")) + "</button>" +
      "</div>";
    var gridHtml = scheduleGridHtml(periods, function (day, periodId) {
      var match = null;
      Object.keys(STATE.schedule.slots).some(function (classId) {
        var slot = scheduleSlot(classId, day, periodId);
        if (slot && slot.teacherId === scheduleTeacherSel) { match = { classObj: classById(classId), slot: slot }; return true; }
        return false;
      });
      if (!match) return '<span class="empty-note" style="margin:0;">' + esc(tr("schedule_emptySlot")) + "</span>";
      return esc(match.slot.subject || tr("schedule_noSubject")) + (match.classObj ? '<div style="font-size:12px;color:var(--ink-soft);">' + esc(match.classObj.name) + "</div>" : "");
    });
    body.innerHTML = '<div class="panel"><div class="panel-body">' + toolbarHtml + gridHtml + "</div></div>";
    document.getElementById("sch-teacher").addEventListener("change", function (e) { scheduleTeacherSel = e.target.value; renderScheduleByTeacher(body); });
    document.getElementById("sch-teacher-export").addEventListener("click", function () {
      var teacher = teacherById(scheduleTeacherSel);
      var out = [[tr("schedule_th_period")].concat(SCHEDULE_DAYS.map(dayLabel))];
      periods.forEach(function (p) {
        var row = [p.label + " (" + p.start + "-" + p.end + ")"];
        SCHEDULE_DAYS.forEach(function (d) {
          var match = null;
          Object.keys(STATE.schedule.slots).some(function (classId) {
            var slot = scheduleSlot(classId, d, p.id);
            if (slot && slot.teacherId === scheduleTeacherSel) { match = { classObj: classById(classId), slot: slot }; return true; }
            return false;
          });
          row.push(match ? (match.slot.subject || "") + (match.classObj ? " - " + match.classObj.name : "") : "");
        });
        out.push(row);
      });
      exportRowsAsExcel(tr("sheet_schedule") + " - " + (teacher ? teacher.name : "") + ".csv", tr("sheet_schedule"), out);
    });

  function openScheduleSlotModal(classId, day, periodId) {
    var classObj = classById(classId);
    var slot = scheduleSlot(classId, day, periodId) || {};
    var subjects = classSubjects(classObj);
    var staff = teachingStaff();
    var body =
      '<div class="form-grid">' +
      field(tr("schedule_subject"), '<select class="input" id="ss-subject"><option value="">' + esc(tr("schedule_noSubject")) + "</option>" +
        subjects.map(function (s) { return '<option value="' + esc(s.subject) + '"' + (s.subject === slot.subject ? " selected" : "") + ">" + esc(s.subject) + "</option>"; }).join("") + "</select>") +
      field(tr("schedule_teacher"), '<select class="input" id="ss-teacher"><option value="">' + esc(tr("schedule_noTeacher")) + "</option>" +
        staff.map(function (t) { return '<option value="' + t.id + '"' + (t.id === slot.teacherId ? " selected" : "") + ">" + esc(t.name) + "</option>"; }).join("") + "</select>") +
      "</div>";
    openModal(
      tr("schedule_assignSlot") + " — " + (classObj ? classObj.name : "") + " — " + dayLabel(day) + " (" + periodLabel(periodId) + ")",
      body,
      '<button class="btn" id="ss-clear">' + esc(tr("schedule_clearSlot")) + '</button>' +
      '<button class="btn" id="ss-cancel">' + esc(tr("common_cancel")) + '</button>' +
      '<button class="btn btn-primary" id="ss-save">' + esc(tr("common_save")) + "</button>"
    );
    document.getElementById("ss-cancel").addEventListener("click", closeModal);
    document.getElementById("ss-clear").addEventListener("click", function () {
      setScheduleSlot(classId, day, periodId, null);
      scheduleSave(tr("toast_scheduleSaved"));
      closeModal();
      toast(tr("toast_scheduleSaved"));
    });
    document.getElementById("ss-save").addEventListener("click", function () {
      var subject = document.getElementById("ss-subject").value || "";
      var teacherId = document.getElementById("ss-teacher").value || "";
      var conflict = teacherId ? teacherConflictAt(day, periodId, teacherId, classId) : null;
      if (!subject && !teacherId) setScheduleSlot(classId, day, periodId, null);
      else setScheduleSlot(classId, day, periodId, { subject: subject, teacherId: teacherId || null });
      scheduleSave(tr("toast_scheduleSaved"));
      closeModal();
      if (conflict) {
        var teacher = teacherById(teacherId);
        toast(tr("schedule_conflictWarning", { name: teacher ? teacher.name : "", day: dayLabel(day), period: periodLabel(periodId) }));
      } else {
        toast(tr("toast_scheduleSaved"));
      }
    });
  }

  function openPeriodsManager() {
    renderPeriodsManagerBody();
  }
  function renderPeriodsManagerBody() {
    var periods = STATE.schedule.periods;
    var body =
      '<div class="table-scroll"><table><thead><tr><th>' + esc(tr("schedule_periodLabel")) + '</th><th>' + esc(tr("schedule_periodStart")) + '</th><th>' + esc(tr("schedule_periodEnd")) + "</th><th></th></tr></thead><tbody>" +
      periods.map(function (p, i) {
        return "<tr>" +
          '<td><input class="input" data-p-label="' + i + '" value="' + esc(p.label) + '"></td>' +
          '<td><input type="time" class="input" data-p-start="' + i + '" value="' + esc(p.start) + '"></td>' +
          '<td><input type="time" class="input" data-p-end="' + i + '" value="' + esc(p.end) + '"></td>' +
          '<td><button class="icon-btn icon-btn-delete" data-p-remove="' + i + '" title="' + esc(tr("common_delete")) + '">' + ICONS.trash + "</button></td>" +
          "</tr>";
      }).join("") +
      "</tbody></table></div>" +
      '<div style="margin-top:12px;"><button class="btn btn-ghost" id="p-add">' + ICONS.plus + " " + esc(tr("schedule_addPeriod")) + "</button></div>";
    openModal(
      tr("schedule_managePeriods"), body,
      '<button class="btn" id="p-cancel">' + esc(tr("common_close")) + '</button><button class="btn btn-primary" id="p-save">' + esc(tr("common_saveChanges")) + "</button>"
    );
    document.getElementById("p-cancel").addEventListener("click", closeModal);
    document.getElementById("p-add").addEventListener("click", function () {
      periods.push({ id: uid("prd"), label: String(periods.length + 1), start: "08:00", end: "09:00" });
      renderPeriodsManagerBody();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-p-remove]"), function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-p-remove"), 10);
        if (!window.confirm(tr("toast_confirmRemovePeriod"))) return;
        var removed = periods.splice(idx, 1)[0];
        if (removed) removePeriodEverywhere(removed.id);
        renderPeriodsManagerBody();
      });
    });
    document.getElementById("p-save").addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll("[data-p-label]"), function (inp) {
        var i = parseInt(inp.getAttribute("data-p-label"), 10);
        if (periods[i]) periods[i].label = inp.value.trim() || periods[i].label;
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-p-start]"), function (inp) {
        var i = parseInt(inp.getAttribute("data-p-start"), 10);
        if (periods[i]) periods[i].start = inp.value || periods[i].start;
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-p-end]"), function (inp) {
        var i = parseInt(inp.getAttribute("data-p-end"), 10);
        if (periods[i]) periods[i].end = inp.value || periods[i].end;
      });
      scheduleSave(tr("toast_periodsSaved"));
      closeModal();
      toast(tr("toast_periodsSaved"));
    });
  }

  /* ==================== التوجيه العام ==================== */
  function renderView() {
    if (currentView === "dashboard") renderDashboard();
    else if (currentView === "students") renderStudents();
    else if (currentView === "attendance") renderAttendance();
    else if (currentView === "grades") renderGrades();
    else if (currentView === "teachers") renderTeachers();
    else if (currentView === "finance") renderFinance();
    else if (currentView === "reports") renderReports();
    else if (currentView === "schedule") renderSchedule();
    else if (currentView === "guardianPortal") renderGuardianPortal();
  }

  /* ==================== تسجيل الدخول والخروج ==================== */
  function userByUsername(username) {
    var u = (username || "").trim().toLowerCase();
    if (!u) return null;
    return STATE.users.filter(function (x) { return (x.username || "").trim().toLowerCase() === u; })[0] || null;
  }

  var loginUsernameDraft = "";

  function renderLoginScreen(errorMsg) {
    renderLangSwitch("login-lang-switch");
    var body = document.getElementById("login-body");
    var activeUsers = STATE.users.filter(function (u) { return u.active !== false; });
    if (!activeUsers.length) {
      body.innerHTML = '<p class="empty-note">' + esc(tr("login_noActiveAccounts")) + "</p>";
      return;
    }
    body.innerHTML =
      (errorMsg ? '<div class="login-error">' + esc(errorMsg) + "</div>" : "") +
      '<div class="login-field"><label>' + esc(tr("login_account")) + '</label><input class="input" dir="ltr" id="login-username" autocomplete="username" value="' + esc(loginUsernameDraft) + '"></div>' +
      '<div class="login-field"><label>' + esc(tr("login_password")) + '</label><input type="password" class="input" id="login-password" autocomplete="current-password"></div>' +
      '<button class="btn btn-primary login-submit" id="login-submit">' + ICONS.check + " " + esc(tr("login_submit")) + "</button>" +
      '<div class="login-hint">' + esc(tr("login_hint")) + "</div>";
    document.getElementById("login-submit").addEventListener("click", handleLoginSubmit);
    document.getElementById("login-username").addEventListener("keydown", function (e) {
      if (e.key === "Enter") document.getElementById("login-password").focus();
    });
    document.getElementById("login-password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") handleLoginSubmit();
    });
    if (loginUsernameDraft) document.getElementById("login-password").focus();
    else document.getElementById("login-username").focus();
  }

  function handleLoginSubmit() {
    var username = document.getElementById("login-username").value;
    var password = document.getElementById("login-password").value;
    loginUsernameDraft = username;
    var attemptKey = (username || "").trim().toLowerCase();

    var lockedMinutes = lockoutRemainingMinutes(attemptKey);
    if (lockedMinutes > 0) {
      renderLoginScreen(tr("login_accountLocked", { n: lockedMinutes }));
      return;
    }

    var user = userByUsername(username);
    if (!user || user.active === false) {
      registerFailedLoginAttempt(attemptKey);
      renderLoginScreen(tr("login_wrongPassword"));
      return;
    }
    var submitBtn = document.getElementById("login-submit");
    if (submitBtn) submitBtn.disabled = true;
    verifyPasswordAsync(user, password).then(function (ok) {
      if (!ok) {
        registerFailedLoginAttempt(attemptKey);
        renderLoginScreen(tr("login_wrongPassword"));
        return;
      }
      clearLoginAttempts(attemptKey);
      loginUsernameDraft = "";
      markUserActivity();
      currentUser = user;
      saveSessionUserId(user.id);
      enterApp();
    });
  }

  function handleLogout(isAutoLogout) {
    clearSessionUserId();
    currentUser = null;
    document.getElementById("app-shell").hidden = true;
    document.getElementById("login-screen").hidden = false;
    renderLoginScreen(isAutoLogout ? tr("login_autoLoggedOut") : null);
  }

  function enterApp() {
    document.getElementById("login-screen").hidden = true;
    document.getElementById("app-shell").hidden = false;
    var allowed = allowedViewsForUser(currentUser);
    if (allowed.indexOf(currentView) === -1) currentView = allowed[0] || null;
    renderNav();
    if (currentView) renderView();
    else document.getElementById("view-root").innerHTML = '<div class="panel"><div class="panel-body"><p class="empty-note">' + esc(tr("noAccess_message")) + "</p></div></div>";
  }

  /* ==================== الإقلاع ==================== */
  applyDocumentDirection();
  applyBrandText();
  document.addEventListener("click", markUserActivity, true);
  document.addEventListener("keydown", markUserActivity, true);
  document.addEventListener("mousemove", markUserActivity, true);
  setInterval(function () {
    if (currentUser && Date.now() - lastActivityTs > IDLE_LOGOUT_MS) {
      handleLogout(true);
    }
  }, 60000);
  migratePlaintextPasswords().then(function (migrated) {
    if (migrated && STANDALONE_MODE) saveStateLocal();
    (function bootSession() {
      var savedId = loadSessionUserId();
      var user = savedId ? userById(savedId) : null;
      if (user && user.active !== false) {
        currentUser = user;
        markUserActivity();
        enterApp();
      } else {
        document.getElementById("app-shell").hidden = true;
        document.getElementById("login-screen").hidden = false;
        renderLoginScreen();
      }
    })();
    initCapability();
    var btnSchoolSettings = document.getElementById("btn-school-settings");
    if (btnSchoolSettings) btnSchoolSettings.addEventListener("click", openSchoolSettings);
  });
})();

</script>

</body>
</html>
